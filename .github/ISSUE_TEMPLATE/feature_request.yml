name: 💡 Feature request
description: Suggest an idea or improvement
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! For open-ended discussion, consider starting a
        [Discussion](https://github.com/andrewsegas/incarna/discussions) instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do, and what's missing or hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? How might it work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Avatars / VRM
        - Actions / animations (.vrma)
        - Voice / lip-sync
        - The Board (panels)
        - Studio / configuration
        - Agent integration (OpenClaw)
        - WebXR / MR experience
        - Docs
        - Other
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, links, references — anything that helps.
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues/discussions and this isn't a duplicate.
          required: true
