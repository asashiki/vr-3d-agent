name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate deterministic scene assets
        run: node scripts/generate-scene-assets.mjs
      - name: Test and validate
        run: npm run test:all
